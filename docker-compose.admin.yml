version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: veostudio_postgres
    environment:
      POSTGRES_DB: veostudio
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_admin_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  webadmin:
    build:
      context: .
      dockerfile: Dockerfile.admin
    container_name: veostudio_webadmin
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      POSTGRES_URL: postgresql://postgres:postgrespassword@postgres:5432/veostudio
    volumes:
      - ./storage:/app/storage
      - ./.env:/app/.env
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: veostudio_admin_tunnel
    command: tunnel --url http://webadmin:8080
    restart: unless-stopped
    depends_on:
      - webadmin

volumes:
  postgres_admin_data:
